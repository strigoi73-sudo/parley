name: Bug report
description: Report a reproducible Parley defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include cookies, session tokens, credentials, or private conversation content.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"

  - type: input
    id: browser
    attributes:
      label: Chrome/Chromium version
      description: Include this when the problem involves live browser behavior.

  - type: textarea
    id: verification
    attributes:
      label: Relevant logs or test output
      description: Redact credentials and private content before pasting.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, cookies, session tokens, and private conversation content from this report.
          required: true
